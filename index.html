<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Obsidian Google Sync Bridge</title>
</head>
<body>
    <p>Authentication in progress. Redirecting to Obsidian...</p>
    <script>
        // 개발자 공식 저장소의 리디렉션 로직과 동일하게 파라미터를 옵시디언 스킴으로 전달
        const hash = window.location.hash;
        const search = window.location.search;
        if (hash || search) {
            window.location.href = "obsidian://google-calendar-sync" + hash + search;
        }
    </script>
</body>
</html>
