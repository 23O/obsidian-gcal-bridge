<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Obsidian Google Calendar Bridge</title>
</head>
<body>
    <p>Authentication in progress...</p>
    <script>
        const hash = window.location.hash;
        const search = window.location.search;
        if (hash || search) {
            window.location.href = "obsidian://google-calendar-sync" + hash + search;
        }
    </script>
</body>
</html>
